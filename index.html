<script>
/* 🔥 FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyB5DmQh3_4qOZKejJWP2Ul4MJ2qeV_QYCg",
  authDomain: "asistencia-orquestando.firebaseapp.com",
  projectId: "asistencia-orquestando"
});
const db = firebase.firestore();

/* PINES */
const pines = {
  "Elvis Ylla Uscamayta": "20261",
  "Nilton Ibarra Vilchez": "20262",
  "Hector Roberto Galvez Zuñiga": "20263"
};
const PIN_ADMIN = "99999";

/* SELECTORES */
const mesSel = document.getElementById("mes");
const anioSel = document.getElementById("anio");
const educadorSel = document.getElementById("educador");
const calendario = document.getElementById("calendario");
const adminEducador = document.getElementById("adminEducador");
const adminFecha = document.getElementById("adminFecha");
const adminEntrada = document.getElementById("adminEntrada");
const adminSalida = document.getElementById("adminSalida");
const adminEstado = document.getElementById("adminEstado");

/* MESES */
["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]
.forEach((m,i)=>mesSel.innerHTML+=`<option value="${i}">${m}</option>`);

/* AÑOS */
for (let y = 2024; y <= 2035; y++) {
  anioSel.innerHTML += `<option>${y}</option>`;
}

/* 🟢 MARCAR ENTRADA / SALIDA */
async function marcar(tipo) {
  const educador = educadorSel.value;
  const pin = document.getElementById("pin").value;
  if (!educador || pin !== pines[educador]) {
    alert("Datos incorrectos");
    return;
  }

  const ahora = new Date();
  const fecha = ahora.toISOString().split("T")[0];
  const hora = ahora.toLocaleTimeString("es-PE", {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
  });

  await db.collection("asistencias")
    .doc(`${educador}-${fecha}`)
    .set({ [tipo]: hora, estado: null }, { merge: true });

  alert(`✅ ${tipo} registrada`);
}

/* 🔐 ADMIN */
function abrirAdmin() {
  const pin = prompt("PIN ADMIN");
  if (pin === PIN_ADMIN) {
    document.getElementById("adminPanel").style.display = "block";
  } else {
    alert("PIN incorrecto");
  }
}

function formatearHoraAdmin(h) {
  if (!h) return "";
  const [hh,mm,ss="00"] = h.split(":");
  const d = new Date();
  d.setHours(hh,mm,ss);
  return d.toLocaleTimeString("es-PE", {
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit",
    hour12:true
  });
}

async function guardarEdicion() {
  const e = adminEducador.value;
  const f = adminFecha.value;
  const estado = adminEstado.value;
  if (!e || !f) {
    alert("Complete los datos");
    return;
  }

  await db.collection("asistencias")
    .doc(`${e}-${f}`)
    .set({
      entrada: estado ? null : formatearHoraAdmin(adminEntrada.value),
      salida: estado ? null : formatearHoraAdmin(adminSalida.value),
      estado: estado || null
    }, { merge: true });

  alert("Registro actualizado");
}

/* 📅 VER ASISTENCIAS (ESTA ERA LA QUE FALTABA) */
async function verAsistencias() {
  calendario.innerHTML = "";

  const educador = educadorSel.value;
  if (!educador) {
    alert("Seleccione educador");
    return;
  }

  const anio = parseInt(anioSel.value);
  const mes = parseInt(mesSel.value);

  const snapshot = await db.collection("asistencias").get();
  const data = {};
  snapshot.forEach(doc => data[doc.id] = doc.data());

  const primerDia = new Date(anio, mes, 1);
  const ultimoDia = new Date(anio, mes + 1, 0).getDate();

  let semana = document.createElement("div");
  semana.className = "semana";
  calendario.appendChild(semana);

  let offset = (primerDia.getDay() + 1) % 7;
  for (let i = 0; i < offset; i++) {
    semana.appendChild(document.createElement("div"));
  }

  for (let d = 1; d <= ultimoDia; d++) {
    const fecha = new Date(anio, mes, d);
    const key = `${educador}-${fecha.toISOString().split("T")[0]}`;
    const r = data[key] || {};

    const div = document.createElement("div");
    div.className = "dia";

    if ([0,6].includes(fecha.getDay())) div.classList.add("fin-semana");
    if (r.estado) div.classList.add(r.estado.replace(" ", ""));
    if (r.entrada) div.classList.add("Entrada");
    if (r.salida) div.classList.add("Salida");

    let texto = "";
    if (r.estado === "Permiso") texto = "🟠 Permiso";
    if (r.estado === "Trabajo Remoto") texto = "🟣 Trabajo Remoto";
    if (r.estado === "Falta") texto = "🔴 Falta injustificada";
    if (r.estado === "Salud") texto = "🟦 Permiso por salud";

    div.innerHTML = `
      <strong>${d}</strong><br>
      ${texto}
      ${!r.estado && r.entrada ? "<br>🟢 "+r.entrada : ""}
      ${!r.estado && r.salida ? "<br>🔵 "+r.salida : ""}
    `;

    semana.appendChild(div);

    if ((fecha.getDay()+1)%7 === 6 && d !== ultimoDia) {
      semana = document.createElement("div");
      semana.className = "semana";
      calendario.appendChild(semana);
    }
  }
}

/* 📥 DESCARGAR EXCEL */
async function descargarExcel() {
  const educador = educadorSel.value;
  if (!educador) {
    alert("Seleccione educador");
    return;
  }

  const anio = anioSel.value;
  const mes = String(Number(mesSel.value) + 1).padStart(2,"0");

  const snapshot = await db.collection("asistencias").get();
  const datos = [["Educador","Fecha","Entrada","Salida","Estado"]];

  snapshot.forEach(doc => {
    if (doc.id.startsWith(educador)) {
      const fecha = doc.id.slice(-10);
      if (fecha.startsWith(`${anio}-${mes}`)) {
        const d = doc.data();
        datos.push([educador, fecha, d.entrada||"", d.salida||"", d.estado||""]);
      }
    }
  });

  if (datos.length === 1) {
    alert("No hay datos");
    return;
  }

  const hoja = XLSX.utils.aoa_to_sheet(datos);
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Asistencias");
  XLSX.writeFile(libro, `Asistencia_${educador}_${anio}_${mes}.xlsx`);
}
</script>
